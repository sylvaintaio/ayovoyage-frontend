<svg viewBox="0 0 520 260" role="img" [attr.aria-label]="'Bus ' + companyName()">
  <!-- Fond : panneau gris papier et filet de chaussée -->
  <rect width="520" height="260" rx="8" style="fill: var(--bv-surface-alt)" />
  <rect x="0" y="214" width="520" height="46" style="fill: var(--bv-ink)" />
  <g style="fill: var(--bv-accent)">
    <rect x="24" y="234" width="48" height="6" />
    <rect x="112" y="234" width="48" height="6" />
    <rect x="200" y="234" width="48" height="6" />
    <rect x="288" y="234" width="48" height="6" />
    <rect x="376" y="234" width="48" height="6" />
    <rect x="464" y="234" width="48" height="6" />
  </g>

  <!-- Carrosserie -->
  <path d="M52 92 q0 -24 24 -24 h332 q28 0 40 26 l20 46 v52 q0 12 -12 12 h-392 q-12 0 -12 -12 z" style="fill: var(--bv-primary)" />
  <!-- Bandeau de marque -->
  <rect x="52" y="164" width="416" height="14" style="fill: var(--bv-accent)" />
  <!-- Vitres -->
  <g style="fill: var(--bv-board)">
    <rect x="74" y="86" width="62" height="50" rx="4" />
    <rect x="146" y="86" width="62" height="50" rx="4" />
    <rect x="218" y="86" width="62" height="50" rx="4" />
    <rect x="290" y="86" width="62" height="50" rx="4" />
    <path d="M364 86 h44 q14 0 20 14 l14 36 h-78 z" />
  </g>
  <!-- Girouette (destination) -->
  <rect x="380" y="74" width="66" height="8" rx="2" style="fill: var(--bv-accent)" />
  <!-- Porte -->
  <rect x="318" y="140" width="34" height="62" style="fill: var(--bv-primary-strong)" />
  <!-- Nom de la compagnie -->
  <text x="78" y="157" font-family="Archivo Variable, sans-serif" font-size="16" font-weight="750" font-stretch="78%" letter-spacing="1.5" fill="#fff">{{ companyName() }}</text>
  <!-- Roues -->
  <g>
    <circle cx="128" cy="206" r="26" style="fill: var(--bv-ink)" />
    <circle cx="128" cy="206" r="10" style="fill: var(--bv-line-strong)" />
    <circle cx="392" cy="206" r="26" style="fill: var(--bv-ink)" />
    <circle cx="392" cy="206" r="10" style="fill: var(--bv-line-strong)" />
  </g>
  <!-- Phare -->
  <rect x="452" y="150" width="14" height="8" rx="2" style="fill: var(--bv-accent-soft)" />
</svg>
