<div class="layout">
  <bv-state [loading]="loading()" [error]="error()" [empty]="passengers().length === 0" emptyIcon="users" emptyTitle="Aucun proche enregistré" emptyText="Ajoutez les personnes avec qui vous voyagez pour réserver plus vite." (retry)="load()">
    <ul class="list-plain stack-sm">
      @for (p of passengers(); track p.id) {
        <li class="card row">
          <div>
            <p class="strong">{{ p.full_name }}</p>
            <p class="small muted">{{ p.relationship || 'Proche' }}{{ p.phone ? ' · ' + p.phone : '' }}</p>
          </div>
          <button type="button" class="btn btn--sm btn--ghost" (click)="remove(p)" [attr.aria-label]="'Supprimer ' + p.full_name">Supprimer</button>
        </li>
      }
    </ul>
  </bv-state>

  <form class="card stack-sm" [formGroup]="form" (ngSubmit)="add()" aria-labelledby="titre-ajout">
    <h2 id="titre-ajout" class="card__title">Ajouter un proche</h2>
    <div class="field">
      <label for="pa-name">Nom complet</label>
      <input id="pa-name" class="input" formControlName="full_name" />
    </div>
    <div class="field">
      <label for="pa-phone">Téléphone (facultatif)</label>
      <input id="pa-phone" class="input" type="tel" formControlName="phone" />
    </div>
    <div class="field">
      <label for="pa-rel">Lien (facultatif)</label>
      <input id="pa-rel" class="input" placeholder="Enfant, conjoint, parent…" formControlName="relationship" />
    </div>
    <button type="submit" class="btn btn--primary" [disabled]="saving()">Ajouter</button>
  </form>
</div>
